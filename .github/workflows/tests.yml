name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar testes do motor
        run: node tests/engine.test.js
      - name: Rodar testes da conciliação
        run: node tests/reconciliation.test.js
      - name: Rodar testes da extração de diaristas
        run: node tests/extraction.test.js
      - name: Rodar testes da exportação conciliada
        run: node tests/export.test.js
